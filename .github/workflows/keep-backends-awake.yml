name: Keep E-BOSS backends awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node.js backend
        run: |
          curl --fail --silent --show-error --max-time 30             https://e-boss-backend.onrender.com/health
          echo "Node.js backend: OK"

      - name: Ping FastAPI backend
        run: |
          curl --fail --silent --show-error --max-time 30             https://e-boss-ai-api.onrender.com/api/health
          echo "FastAPI backend: OK"
